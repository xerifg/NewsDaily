name: Daily Tech News to WeChat

on:
  schedule:
    # GitHub Actions 使用 UTC，这里是每天 02:00 UTC = 北京时间 10:00
    # （错开 arXiv 论文公告的刷新时间，保证当天批次能被抓到）
    - cron: '0 2 * * *'
  # 手动触发，方便调试
  workflow_dispatch:

permissions:
  # 归档日报需要把 docs/ 提交回仓库
  contents: write

jobs:
  fetch-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch tech news and send via ServerChan
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # 用于抓取 GitHub Releases，使用 Actions 自动提供的 token 避免限流
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 可选：不填则脚本默认 deepseek-chat
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          # 可选：不填则脚本默认 https://api.deepseek.com
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
          # 可选：逗号分隔多个渠道，默认 serverchan
          PUSH_CHANNELS: ${{ vars.PUSH_CHANNELS }}
          # 可选：日报站点地址（GitHub Pages），推送摘要中的“查看完整日报”链接
          SITE_URL: ${{ vars.SITE_URL }}
          # 可选：推送正文字节上限，默认 1000（微信模板消息约 1KB；走企业微信等长内容通道可调大）
          PUSH_MAX_BYTES: ${{ vars.PUSH_MAX_BYTES }}
        run: |
          python scripts/fetch_tech_news.py

      - name: Commit daily report archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No archive changes to commit."
          else
            git commit -m "docs: archive daily report $(date -u +%F)"
            git push
          fi
