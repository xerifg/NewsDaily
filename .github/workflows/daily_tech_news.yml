name: Daily Tech News to WeChat

on:
  schedule:
    # GitHub Actions 使用 UTC，这里是每天 00:00 UTC = 北京时间 08:00
    - cron: '0 0 * * *'
  # 手动触发，方便调试
  workflow_dispatch:

jobs:
  fetch-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch tech news and send via ServerChan
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # 可选：不填则脚本默认 deepseek-chat
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          # 可选：不填则脚本默认 https://api.deepseek.com
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
        run: |
          python scripts/fetch_tech_news.py
