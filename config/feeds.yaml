# HuggingFace Daily Papers：社区热榜论文（公开 API，无需鉴权）
# 该接口返回滚动热榜（近几日最高赞），不按时间窗过滤，直接取 Top N
huggingface_papers:
  enabled: true
  max_items: 8
  # 按上方 paper_keywords 过滤，聚焦自动驾驶/机器人方向；
  # 设为 false 则不过滤（全领域热榜论文）
  filter_by_keywords: true

# GitHub Trending：每日热榜仓库（HTML 解析）
# 独立成“开源项目”板块，默认不过滤关键词，直接取当日前 N 名最火仓库
github_trending:
  enabled: true
  max_items: 10
  # 是否按关键词过滤后再取前 N 名；默认 false = 不过滤（看全量最火仓库）
  filter_by_keywords: false
  # 仓库全名/描述命中任一关键词才保留（小写匹配），仅当 filter_by_keywords 为 true 时生效
  keywords:
    - llm
    - agent
    - autonomous
    - driving
    - robot
    - robotics
    - vision
    - vla
    - diffusion
    - embodied
    - world model
    - inference

# ============================================================
# 数量与窗口控制
# ============================================================
limits:
  # 过去多少小时的资讯
  hours_window: 24
  # 每个源最多取多少条
  max_items_per_source: 15
  # 每个类别最多保留多少条
  max_items_per_category: 30
  # 交给大模型总结时，每个类别最多提供多少篇（避免 prompt 过长）
  max_items_for_llm_per_category: 15
  # 标题相似度阈值：超过则认为是同一新闻（跨源去重）
  title_similarity_threshold: 0.82
