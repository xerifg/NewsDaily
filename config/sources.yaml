# ============================================================
# 订阅源总表（2026-08-30 调研整理）
# ------------------------------------------------------------
# 本文件是人工整理的"推荐源清单"（含订阅方式说明），用于参考/审计。
# ⚠️ 实际运行生效的配置在 config/feeds.yaml —— 抓取脚本只读 feeds.yaml。
#     需要真正启用某个源时，把它按对应结构追加到 feeds.yaml 即可。
#
# type 字段说明（决定"能不能直接 RSS 订阅"）：
#   rss        有官方 RSS/Atom，可直接订阅、直接进抓取脚本
#   rsshub     无官方 RSS，需通过 RSSHub（rsshub.app 公共实例或自建）转出
#   wechat     微信公众号，无官方 RSS；需 RSSHub /wechat 路由（要公众号 cookie，
#              公共实例不稳定，建议自建或改用 Google News site: 查询覆盖）
#   newsletter 邮件订阅制（多数 substack 同时提供 /feed，可直接 RSS）
#   arxiv      arXiv 分类 RSS（rss.arxiv.org，周末不更新属正常）
#   api        公开 API / 网页，由脚本内置逻辑处理
#   github     GitHub 仓库（Releases / Trending）
#
# domain 字段：AI | 自动驾驶 | 机器人 | 论文 | 开源项目 | 综合
# kind   字段：新闻资讯 | 技术方案 | 论文 | 社区
# ============================================================

